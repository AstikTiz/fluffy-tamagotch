  <path d="M 180 370 C 220 395 292 395 332 370 C 340 385 320 405 256 405 C 192 405 172 385 180 370 Z" fill="#dc2626" stroke="#991b1b" stroke-width="4" />
  <line x1="210" y1="375" x2="220" y2="395" stroke="#ffffff" stroke-width="8" />
  <line x1="256" y1="380" x2="256" y2="405" stroke="#ffffff" stroke-width="8" />
  <line x1="302" y1="375" x2="292" y2="395" stroke="#ffffff" stroke-width="8" />
