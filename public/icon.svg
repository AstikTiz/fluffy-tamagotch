  <ellipse cx="256" cy="340" rx="95" ry="85" fill="#fef3c7" stroke="#ca8a04" stroke-width="3" />
  <!-- Eyes (button glass) -->
  <ellipse cx="205" cy="270" rx="22" ry="26" fill="#1c1917" />
