      <stop offset="0%" stopColor="#292524" />
      <stop offset="100%" stopColor="#0c0a09" />
    </radialGradient>
    <radialGradient id="feltGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#f7e5b5" />
      <stop offset="60%" stopColor="#e5a93b" />
      <stop offset="100%" stopColor="#b45309" />
